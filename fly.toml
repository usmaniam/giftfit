# Deploy: fly launch --no-deploy --copy-config && fly volumes create giftfit_data --size 1 --region ams
#         fly secrets set INVITE_TOKEN_SECRET=$(openssl rand -hex 24)   # optional, otherwise auto-generated and kept on the volume
#         fly deploy
# Set APP_URL to your public URL so invite links are correct. Runs in demo mode unless you set DEMO_MODE=false and YOUCAM_API_KEY.
app = "giftfit"
primary_region = "ams"

[build]

[env]
  DEMO_MODE = "true"
  APP_URL = "https://giftfit.fly.dev"

[mounts]
  source = "giftfit_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  method = "GET"
  path = "/api/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
