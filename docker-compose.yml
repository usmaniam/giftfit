services:
  giftfit:
    build: .
    ports: ["3000:3000"]
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      APP_URL: ${APP_URL:-http://localhost:3000}
      YOUCAM_API_KEY: ${YOUCAM_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GIFT_AGENT_MODEL: ${GIFT_AGENT_MODEL:-}
    volumes: ["giftfit-data:/data"]
volumes:
  giftfit-data:
