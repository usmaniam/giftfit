# Local Postgres for development: `docker compose up -d db`, then use DATABASE_URL from .env.example.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: giftfit
    ports: ["5432:5432"]
    volumes: ["giftfit-pg:/var/lib/postgresql/data"]
volumes:
  giftfit-pg:
